[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turkish-linguistic-features"
dynamic = ["version"]
description = "A comprehensive toolkit for extracting quantitative linguistic features from Turkish and English text."
readme = "README.md"
keywords = [
    "turkish", "text-analysis", "feature-extraction", "stylometry-features",
    "nlp", "computational-linguistics", "digital-humanities",
    "readability", "lexical-richness", "morphology",
]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Efe Ziya Okul", email = "efeziya@live.com" },
    { name = "Ferhat Ersoy", email = "eferhaters@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.21",
    "spacy>=3.5,<4",
    "zeyrek>=0.1.3,<0.2",
    "textstat>=0.7",
]

[project.optional-dependencies]
pandas       = ["pandas>=1.5"]
lexical_freq = ["wordfreq>=3.0"]
all = ["pandas>=1.5", "wordfreq>=3.0"]
# `dev` ekstrası 2026-09-21'de kaldırıldı: geliştirme bağımlılıkları
# requirements.txt'te, tek yerde. Yayımlanan paket onları duyurmasın.

[tool.hatch.version]
path = "turkish_linguistic_features/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: dakikalar sürebilen test (5 MB metin gibi); -m 'not slow' ile atlanır",
]

[tool.mypy]
packages = ["turkish_linguistic_features"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["turkish_linguistic_features"]
