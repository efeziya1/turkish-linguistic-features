[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turkish-linguistic-features"
dynamic = ["version"]
description = "A comprehensive toolkit for extracting quantitative linguistic features from Turkish and English text."
readme = "README.md"
keywords = [
    "quantitative-linguistics", "computational-linguistics", "corpus-linguistics",
    "stylometry", "turkish", "english", "feature-extraction", "text-analysis",
    "natural-language-processing", "readability", "lexical-richness",
    "lexical-diversity", "syntactic-complexity", "morphology", "digital-humanities",
]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Efe Ziya Okul", email = "efeziya@live.com" },
    { name = "Ferhat Ersoy", email = "eferhaters@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.21",
    "spacy>=3.5,<4",
    "zeyrek>=0.1.3,<0.2",
    # 0.7.10+: İngilizce hece NLTK cmudict ile (veri bir kez elle kurulur,
    # bkz. README). <0.8: hece sayım yöntemi sürüm içinde sabit kalsın.
    "textstat>=0.7.10,<0.8",
    # Doğrudan import ediliyor (cmudict denetimi).
    "nltk>=3.8",
]

[project.urls]
Repository    = "https://github.com/efeziya1/turkish-linguistic-features"
Documentation = "https://github.com/efeziya1/turkish-linguistic-features/tree/main/docs"
Issues        = "https://github.com/efeziya1/turkish-linguistic-features/issues"

[project.optional-dependencies]
pandas       = ["pandas>=1.5"]
lexical_freq = ["wordfreq>=3.0"]
all = ["pandas>=1.5", "wordfreq>=3.0"]
# `dev` ekstrası 2026-09-21'de kaldırıldı: geliştirme bağımlılıkları
# requirements.txt'te, tek yerde. Yayımlanan paket onları duyurmasın.

[tool.hatch.version]
path = "turkish_linguistic_features/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Why: console-script pytest.exe repo kokunu sys.path'e koymaz; tests/ icindeki
# `from scripts...` importlari yalniz `python -m pytest` ile calisirdi.
pythonpath = ["."]
# Why: `slow` testi (5 MB metin, ~18 dk) sürenin %87'sini yiyordu; künyesi
# zaten "varsayılan koşuda atlanıyor" diyordu ama bunu bağlayan ayar yoktu.
# Hepsini koşmak için: pytest -m ""
addopts = "-m 'not slow'"
markers = [
    "slow: dakikalar sürebilen test (5 MB metin gibi); -m 'not slow' ile atlanır",
]

[tool.mypy]
packages = ["turkish_linguistic_features"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["turkish_linguistic_features"]
