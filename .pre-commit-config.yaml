repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: plan-encrypted
        name: plan/ git-crypt ile şifreli mi
        language: python
        entry: python scripts/check_plan_encrypted.py
        files: ^plan/
